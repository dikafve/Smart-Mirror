
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
#booth{background:#111;border-radius:14px;overflow:hidden;font-family:'DM Sans',sans-serif;border:1px solid #2a2a2a;color:#eee;}

.top-bar{background:#000;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #222;}
.logo{font-family:'Playfair Display',serif;font-size:18px;color:#fff;letter-spacing:0.02em;}
.logo span{color:#888;font-size:13px;font-weight:400;font-family:'DM Mono',monospace;margin-left:8px;}
#statusBadge{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.12em;color:#555;padding:3px 10px;border:1px solid #2a2a2a;border-radius:100px;}
#statusBadge.live{color:#eee;border-color:#444;}

.body-row{display:flex;min-height:420px;}

.cam-area{flex:1;position:relative;background:#000;overflow:hidden;}
#vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:none;}
#cvs{position:absolute;inset:0;width:100%;height:100%;transform:scaleX(-1);display:none;}
.vf{position:absolute;inset:0;pointer-events:none;}
.vc{position:absolute;width:18px;height:18px;}
.vc.tl{top:10px;left:10px;border-top:1.5px solid #555;border-left:1.5px solid #555;}
.vc.tr{top:10px;right:10px;border-top:1.5px solid #555;border-right:1.5px solid #555;}
.vc.bl{bottom:10px;left:10px;border-bottom:1.5px solid #555;border-left:1.5px solid #555;}
.vc.br{bottom:10px;right:10px;border-bottom:1.5px solid #555;border-right:1.5px solid #555;}
.cam-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#333;font-size:13px;text-align:center;padding:20px;}
.cam-ph i{font-size:32px;opacity:0.3;}
.flash-ov{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;}
.cd-num{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Playfair Display',serif;font-size:96px;color:#fff;opacity:0;pointer-events:none;text-shadow:0 0 40px rgba(0,0,0,0.8);}

.right-panel{width:200px;background:#0a0a0a;border-left:1px solid #1e1e1e;display:flex;flex-direction:column;}

.size-hero{padding:16px 14px 12px;border-bottom:1px solid #1a1a1a;text-align:center;}
.size-hero .label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.14em;color:#444;margin-bottom:6px;}
.size-num{font-family:'Playfair Display',serif;font-size:56px;color:#fff;line-height:1;}
.size-sub{font-size:11px;color:#555;margin-top:2px;font-family:'DM Mono',monospace;}

.chips{display:flex;gap:4px;justify-content:center;padding:10px 14px;border-bottom:1px solid #1a1a1a;}
.chip{font-size:10px;padding:3px 8px;border-radius:100px;border:1px solid #2a2a2a;color:#444;font-family:'DM Mono',monospace;transition:all 0.2s;}
.chip.active{background:#fff;color:#000;border-color:#fff;}

.measures{padding:10px 14px;display:flex;flex-direction:column;gap:5px;border-bottom:1px solid #1a1a1a;}
.mrow{display:flex;justify-content:space-between;font-size:11px;}
.mk{color:#444;font-family:'DM Mono',monospace;}
.mv{color:#bbb;font-weight:500;}

.conf-area{padding:10px 14px;border-bottom:1px solid #1a1a1a;}
.conf-label{display:flex;justify-content:space-between;font-size:10px;color:#444;font-family:'DM Mono',monospace;margin-bottom:4px;}
.conf-bg{height:2px;background:#1e1e1e;border-radius:1px;}
.conf-fill{height:2px;background:#666;border-radius:1px;width:0%;transition:width 0.4s;}

.strip-area{flex:1;padding:10px 14px;display:flex;flex-direction:column;gap:6px;overflow-y:auto;}
.strip-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.12em;color:#333;}
.snaps{display:flex;flex-direction:column;gap:5px;}
.snap-slot{width:100%;aspect-ratio:4/3;background:#111;border:1px solid #1e1e1e;border-radius:4px;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;}
.snap-slot canvas{width:100%;height:100%;object-fit:cover;}
.snap-slot .ph{color:#2a2a2a;font-size:10px;text-align:center;}
.snap-slot .ph i{font-size:14px;display:block;margin-bottom:2px;}
.snap-tag{position:absolute;bottom:3px;right:4px;font-family:'DM Mono',monospace;font-size:9px;background:rgba(0,0,0,0.7);color:#888;padding:1px 4px;border-radius:2px;}

.footer{background:#000;border-top:1px solid #1e1e1e;padding:10px 16px;display:flex;align-items:center;gap:10px;}
.cd-select{display:flex;gap:4px;}
.cd-btn{font-family:'DM Mono',monospace;font-size:11px;padding:5px 10px;border-radius:100px;border:1px solid #2a2a2a;background:none;color:#555;cursor:pointer;transition:all 0.15s;}
.cd-btn:hover{border-color:#444;color:#999;}
.cd-btn.sel{background:#222;border-color:#555;color:#eee;}
.cd-label{font-size:10px;color:#333;font-family:'DM Mono',monospace;margin-right:2px;}
.shutter{margin-left:auto;background:#fff;color:#000;border:none;border-radius:100px;padding:8px 20px;font-size:12px;font-weight:500;font-family:'DM Sans',sans-serif;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all 0.15s;}
.shutter:hover{background:#ddd;}
.shutter:active{transform:scale(0.97);}
.shutter.stop{background:#222;color:#888;border:1px solid #2a2a2a;}

.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,0.88);display:none;align-items:center;justify-content:center;z-index:10;}
.modal-bg.open{display:flex;}
.modal{background:#111;border:1px solid #2a2a2a;border-radius:10px;padding:16px;width:260px;display:flex;flex-direction:column;gap:12px;}
.modal-img{width:100%;aspect-ratio:4/3;border-radius:6px;overflow:hidden;border:1px solid #222;}
.modal-img canvas{width:100%;height:100%;object-fit:cover;}
.modal-info{display:flex;flex-direction:column;gap:5px;}
.modal-size{font-family:'Playfair Display',serif;font-size:32px;color:#fff;}
.modal-sub{font-size:11px;color:#555;font-family:'DM Mono',monospace;}
.modal-stats{display:flex;flex-direction:column;gap:4px;}
.modal-row{display:flex;justify-content:space-between;font-size:11px;padding:4px 8px;background:#0a0a0a;border-radius:4px;}
.modal-k{color:#444;font-family:'DM Mono',monospace;}
.modal-v{color:#bbb;}
.modal-close{background:#1a1a1a;border:1px solid #2a2a2a;color:#888;border-radius:6px;padding:7px;font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;text-align:center;}
.modal-close:hover{color:#eee;}
</style>

<div id="booth" style="position:relative;">

  <div class="top-bar">
    <div class="logo">Smart Mirror</div>
    <div id="statusBadge">STANDBY</div>
  </div>

  <div class="body-row">
    <div class="cam-area" id="camArea">
      <video id="vid" playsinline muted></video>
      <canvas id="cvs"></canvas>
      <div class="vf">
        <div class="vc tl"></div><div class="vc tr"></div>
        <div class="vc bl"></div><div class="vc br"></div>
      </div>
      <div class="cam-ph" id="camPh">
        <i class="ti ti-camera" aria-hidden="true"></i>
        <span>Tekan Mulai untuk<br>mengaktifkan kamera</span>
      </div>
      <div class="flash-ov" id="flashOv"></div>
      <div class="cd-num" id="cdNum"></div>
    </div>

    <div class="right-panel">
      <div class="size-hero">
        <div class="label">UKURAN TERDETEKSI</div>
        <div class="size-num" id="sLetter">—</div>
        <div class="size-sub" id="sName">belum terdeteksi</div>
      </div>
      <div class="chips">
        <div class="chip" data-s="XS">XS</div>
        <div class="chip" data-s="S">S</div>
        <div class="chip" data-s="M">M</div>
        <div class="chip" data-s="L">L</div>
        <div class="chip" data-s="XL">XL</div>
      </div>
      <div class="measures">
        <div class="mrow"><span class="mk">bahu</span><span class="mv" id="mSh">—</span></div>
        <div class="mrow"><span class="mk">pinggul</span><span class="mv" id="mHp">—</span></div>
        <div class="mrow"><span class="mk">rasio s/h</span><span class="mv" id="mRt">—</span></div>
      </div>
      <div class="conf-area">
        <div class="conf-label"><span>akurasi deteksi</span><span id="confPct">0%</span></div>
        <div class="conf-bg"><div class="conf-fill" id="confFill"></div></div>
      </div>
      <div class="strip-area">
        <div class="strip-label">HASIL FOTO — klik untuk lihat</div>
        <div class="snaps" id="snapsContainer">
          <div class="snap-slot" id="sl0"><div class="ph"><i class="ti ti-photo" aria-hidden="true"></i>foto 1</div></div>
          <div class="snap-slot" id="sl1"><div class="ph"><i class="ti ti-photo" aria-hidden="true"></i>foto 2</div></div>
          <div class="snap-slot" id="sl2"><div class="ph"><i class="ti ti-photo" aria-hidden="true"></i>foto 3</div></div>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    <span class="cd-label">hitung mundur:</span>
    <div class="cd-select">
      <button class="cd-btn sel" data-sec="3">3s</button>
      <button class="cd-btn" data-sec="5">5s</button>
      <button class="cd-btn" data-sec="10">10s</button>
    </div>
    <button class="shutter" id="btnMain">
      <i class="ti ti-camera" aria-hidden="true"></i> Mulai
    </button>
  </div>

  <div class="modal-bg" id="modal">
    <div class="modal">
      <div class="modal-img" id="modalImgWrap"></div>
      <div class="modal-info">
        <div class="modal-size" id="modalSize">—</div>
        <div class="modal-sub" id="modalSub">—</div>
      </div>
      <div class="modal-stats" id="modalStats"></div>
      <button class="modal-close" id="modalClose">Tutup</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1640029074/camera_utils.js"></script>
<script>
const vid=document.getElementById('vid'),cvs=document.getElementById('cvs'),ctx=cvs.getContext('2d');
const btn=document.getElementById('btnMain'),flashOv=document.getElementById('flashOv');
const cdNum=document.getElementById('cdNum'),camPh=document.getElementById('camPh');
const statusBadge=document.getElementById('statusBadge');

let cam=null,pose=null,running=false,shooting=false;
let buf=[],snapCount=0,selectedSec=3;
let snapData=[null,null,null];
let lastMeasures={sh:'—',hp:'—',rt:'—',size:'—',name:'—'};

document.querySelectorAll('.cd-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    if(shooting) return;
    document.querySelectorAll('.cd-btn').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel');
    selectedSec=parseInt(b.dataset.sec);
  });
});

function dist(a,b){return Math.sqrt((a.x-b.x)**2+(a.y-b.y)**2);}
function classify(sr){
  if(sr<0.30) return {letter:'XS',name:'extra small'};
  if(sr<0.36) return {letter:'S',name:'small'};
  if(sr<0.42) return {letter:'M',name:'medium'};
  if(sr<0.48) return {letter:'L',name:'large'};
  return {letter:'XL',name:'extra large'};
}

function drawSkel(lms){
  const w=cvs.width,h=cvs.height;
  ctx.clearRect(0,0,w,h);
  [[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]].forEach(([a,b])=>{
    const la=lms[a],lb=lms[b];
    if(!la||!lb||la.visibility<0.4||lb.visibility<0.4) return;
    ctx.beginPath();ctx.moveTo(la.x*w,la.y*h);ctx.lineTo(lb.x*w,lb.y*h);
    ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=1.5;ctx.stroke();
  });
  [0,11,12,13,14,15,16,23,24,25,26,27,28].forEach(i=>{
    const lm=lms[i];if(!lm||lm.visibility<0.4) return;
    ctx.beginPath();ctx.arc(lm.x*w,lm.y*h,4,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,0.7)';ctx.fill();
  });
}

function updateUI(lms,conf){
  const shl=lms[11],shr=lms[12],hpl=lms[23],hpr=lms[24],nose=lms[0];
  const mhip={x:(hpl.x+hpr.x)/2,y:(hpl.y+hpr.y)/2};
  const shW=dist(shl,shr),hpW=dist(hpl,hpr),bodyH=dist(nose,mhip)||1;
  const sr=shW/bodyH;
  buf.push(sr);if(buf.length>20) buf.shift();
  const avg=buf.reduce((a,b)=>a+b,0)/buf.length;
  const sz=classify(avg);
  const rt=hpW>0?(shW/hpW).toFixed(2):'—';

  lastMeasures={sh:(shW*100).toFixed(1)+' u',hp:(hpW*100).toFixed(1)+' u',rt,size:sz.letter,name:sz.name};

  document.getElementById('sLetter').textContent=sz.letter;
  document.getElementById('sName').textContent=sz.name;
  document.getElementById('mSh').textContent=lastMeasures.sh;
  document.getElementById('mHp').textContent=lastMeasures.hp;
  document.getElementById('mRt').textContent=rt;
  const cp=Math.round(conf*100);
  document.getElementById('confPct').textContent=cp+'%';
  document.getElementById('confFill').style.width=cp+'%';
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c.dataset.s===sz.letter));
  statusBadge.textContent='LIVE';statusBadge.className='status-badge live';
}

function doFlash(){
  flashOv.style.transition='none';flashOv.style.opacity='1';
  setTimeout(()=>{flashOv.style.transition='opacity 0.3s';flashOv.style.opacity='0';},60);
}

function captureSnap(){
  const idx=snapCount%3;
  const sc=document.createElement('canvas');
  sc.width=cvs.width||640;sc.height=cvs.height||480;
  const sctx=sc.getContext('2d');
sctx.filter='contrast(1.1)';
  sctx.save();sctx.scale(-1,1);sctx.drawImage(vid,-sc.width,0,sc.width,sc.height);sctx.restore();
  sctx.filter='none';sctx.drawImage(cvs,0,0);

  snapData[idx]={canvas:sc,measures:{...lastMeasures}};

  const slot=document.getElementById('sl'+idx);
  slot.innerHTML='';
  const mini=document.createElement('canvas');
  mini.width=160;mini.height=120;
  mini.getContext('2d').drawImage(sc,0,0,160,120);
  slot.appendChild(mini);
  const tag=document.createElement('div');
  tag.className='snap-tag';tag.textContent='#'+(snapCount+1)+' · '+lastMeasures.size;
  slot.appendChild(tag);
  slot.onclick=()=>openModal(idx);

  snapCount++;
  doFlash();
}

function openModal(idx){
  const d=snapData[idx];if(!d) return;
  const wrap=document.getElementById('modalImgWrap');wrap.innerHTML='';
  const mc=document.createElement('canvas');mc.width=240;mc.height=180;
  mc.getContext('2d').drawImage(d.canvas,0,0,240,180);
  wrap.appendChild(mc);
  document.getElementById('modalSize').textContent=d.measures.size;
  document.getElementById('modalSub').textContent=d.measures.name;
  const statsEl=document.getElementById('modalStats');
  statsEl.innerHTML=[
    ['lebar bahu',d.measures.sh],
    ['lebar pinggul',d.measures.hp],
    ['rasio s/h',d.measures.rt]
  ].map(([k,v])=>`<div class="modal-row"><span class="modal-k">${k}</span><span class="modal-v">${v}</span></div>`).join('');
  document.getElementById('modal').classList.add('open');
}

document.getElementById('modalClose').onclick=()=>document.getElementById('modal').classList.remove('open');
document.getElementById('modal').addEventListener('click',e=>{if(e.target===document.getElementById('modal')) document.getElementById('modal').classList.remove('open');});

function countdown(n,cb){
  if(n<=0){cdNum.style.opacity='0';cb();return;}
  cdNum.textContent=n;cdNum.style.opacity='1';
  setTimeout(()=>{cdNum.style.opacity='0';setTimeout(()=>countdown(n-1,cb),200);},700);
}

async function startCam(){
  try{
    statusBadge.textContent='LOADING...';
    pose=new Pose({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/${f}`});
    pose.setOptions({modelComplexity:1,smoothLandmarks:true,enableSegmentation:false,minDetectionConfidence:0.5,minTrackingConfidence:0.5});
    pose.onResults(res=>{
      if(!running) return;
      cvs.width=vid.videoWidth||640;cvs.height=vid.videoHeight||480;
      if(res.poseLandmarks){
        const vis=res.poseLandmarks.slice(11,25);
        const conf=vis.reduce((s,l)=>s+(l.visibility||0),0)/vis.length;
        drawSkel(res.poseLandmarks);
        if(conf>0.45) updateUI(res.poseLandmarks,conf);
      } else {ctx.clearRect(0,0,cvs.width,cvs.height);statusBadge.textContent='CARI...';}
    });
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:640,height:480}});
    vid.srcObject=stream;vid.style.display='block';cvs.style.display='block';camPh.style.display='none';
    await vid.play();
    cam=new Camera(vid,{onFrame:async()=>{if(pose&&running) await pose.send({image:vid});},width:640,height:480});
    await cam.start();
    running=true;
    btn.innerHTML='<i class="ti ti-camera" aria-hidden="true"></i> Foto!';
    btn.onclick=triggerShot;
  } catch(e){
    statusBadge.textContent='ERROR';
    camPh.innerHTML='<i class="ti ti-alert-circle" style="font-size:28px;opacity:0.3;"></i><span>Izin kamera ditolak.<br>Cek pengaturan browser.</span>';
  }
}

function triggerShot(){
  if(shooting) return;
  shooting=true;
  btn.disabled=true;
  countdown(selectedSec,()=>{
    captureSnap();
    shooting=false;
    btn.disabled=false;
  });
}

btn.addEventListener('click',()=>{if(!running) startCam();});
</script>
